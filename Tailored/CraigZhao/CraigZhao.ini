[custom]
enable_rule_generator=true
overwrite_original_rules=true

; =============== 局域网直连 ===============
ruleset=🎯 国内流量,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
; =============== OpenAI / ChatGPT ===============
; 基础清单：覆盖 chatgpt.com/openai.com、Sora、主要静态资源、API、CAPTCHA 和 LiveKit。
; ma-wenqian 的 livekit.cloud 属于较宽匹配：其他 LiveKit 使用者也可能进入 ChatGPT 组。
ruleset=🤖 OpenAI,https://raw.githubusercontent.com/ma-wenqian/ai-proxy-rules/main/rules/openai.list

; VPSDance 中值得单独补充的入口（不引入其整套宽泛的支付/监控/IP-ASN 规则）
ruleset=🤖 OpenAI,[]DOMAIN-SUFFIX,ai.com
ruleset=🤖 OpenAI,[]DOMAIN-SUFFIX,chat.com

; OpenAI 官方 ChatGPT 网络建议中列出，但三份社区列表未完整覆盖的资源
; 精确主机名尽可能减少误匹配。WorkOS、Cloudflare 等仍是多用户共享基础设施。
ruleset=🤖 OpenAI,[]DOMAIN-SUFFIX,oaistatsig.com
ruleset=🤖 OpenAI,[]DOMAIN,cdn.openaimerge.com
ruleset=🤖 OpenAI,[]DOMAIN,cdn.workos.com
ruleset=🤖 OpenAI,[]DOMAIN,forwarder.workos.com
ruleset=🤖 OpenAI,[]DOMAIN,frontend-apps-multi-region.workos.com
ruleset=🤖 OpenAI,[]DOMAIN,images.workoscdn.com
ruleset=🤖 OpenAI,[]DOMAIN,setup.workos.com
ruleset=🤖 OpenAI,[]DOMAIN,workos.imgix.net
ruleset=🤖 OpenAI,[]DOMAIN,js.stripe.com
ruleset=🤖 OpenAI,[]DOMAIN,rum.browser-intake-datadoghq.com

; 可选：如果出现 Cloudflare 验证/验证码问题再取消注释。该域名为共享服务。
;ruleset=🤖 OpenAI,[]DOMAIN,challenges.cloudflare.com
; 可选：遇到 OpenAI 邮件追踪资源请求异常时再放开，不是聊天必需项。
;ruleset=🤖 OpenAI,[]DOMAIN-SUFFIX,ct.sendgrid.net
; 可选：部分客服或错误上报功能，不推荐默认将整个第三方服务代理。
;ruleset=🤖 OpenAI,[]DOMAIN-SUFFIX,intercom.io
;ruleset=🤖 OpenAI,[]DOMAIN-SUFFIX,intercomcdn.com

; 如果以“覆盖尽可能广”为目标，可改用下面 VPSDance 整套规则；
; 启用前建议先注释掉 ma-wenqian 和上面的补充规则以避免重复。
; 注意：需要订阅转换器支持 clash-classic YAML 和里面的规则类型。
;ruleset=🤖 OpenAI,clash-classic:https://raw.githubusercontent.com/VPSDance/ai-proxy-rules/main/rules/clash/openai.yaml

; =============== 游戏下载 ===============
; 这些规则一定要放在游戏平台规则前，以免 Steam/Epic 下载 CDN 被先匹配。
ruleset=⬇️ 游戏下载,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Game/GameDownloadCN/GameDownloadCN.list
ruleset=⬇️ 游戏下载,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Game/GameDownload/GameDownload.list

; =============== 游戏平台 ===============
; Steam 商店/社区与 Epic 平台优先使用指定代理，下载被上面规则提前截走。
ruleset=🎮 游戏平台,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Steam.list
ruleset=🎮 游戏平台,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Epic/Epic.list
ruleset=🎮 游戏平台,[]DOMAIN-SUFFIX,ea.com
ruleset=🎮 游戏平台,[]DOMAIN-SUFFIX,origin.com
ruleset=🎮 游戏平台,[]DOMAIN-SUFFIX,battle.net
ruleset=🎮 游戏平台,[]DOMAIN-SUFFIX,battlenet.com
ruleset=🎮 游戏平台,[]DOMAIN-SUFFIX,blizzard.com
ruleset=🎮 游戏平台,[]DOMAIN-SUFFIX,gog.com
ruleset=🎮 游戏平台,[]DOMAIN-SUFFIX,ubisoft.com
ruleset=🎮 游戏平台,[]DOMAIN-SUFFIX,uplay.com
ruleset=🎮 游戏平台,[]DOMAIN-SUFFIX,xbox.com
ruleset=🎮 游戏平台,[]DOMAIN-SUFFIX,xboxlive.com
ruleset=🎮 游戏平台,[]DOMAIN-SUFFIX,gamepass.com
ruleset=🎮 游戏平台,[]DOMAIN-SUFFIX,playstation.com
ruleset=🎮 游戏平台,[]DOMAIN-SUFFIX,playstation.net
ruleset=🎮 游戏平台,[]DOMAIN-SUFFIX,playstationnetwork.com

; =============== 可选 ===============
; =============== 允许部分 Google 相关域名走直连，但不一定适合所有网络 ===============
;ruleset=🎯 国内流量,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/GoogleCN.list

; =============== 兜底 ===============
; 中国 IP 直连；其余走默认节点组。局域网直连应在你的客户端基础配置中单独处理。
ruleset=🎯 国内流量,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=🎯 国内流量,[]GEOIP,CN
ruleset=🐟 漏网之鱼,[]FINAL



; =============== 策略组 ===============
custom_proxy_group=🚀 海外流量`select`.*
custom_proxy_group=🤖 OpenAI`select`(^(?!.*(HK|香港|Hong[ _-]?Kong)).*)
custom_proxy_group=⬇️ 游戏下载`select`[]🚀 海外流量`[]DIRECT
custom_proxy_group=🎮 游戏平台`select`[]🚀 海外流量
custom_proxy_group=🎯 国内流量`select`[]DIRECT`[]🚀 海外流量
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 海外流量`[]DIRECT